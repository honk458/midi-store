name: Auto Update Index JSON

on:
  push:
    branches:
      - main
    paths:
      - 'tone/**'
      - 'music/**'
  workflow_dispatch: # Cho phép bấm chạy thủ công nếu muốn

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update index.json in tone and music
        run: |
          # Cập nhật index.json trong thư mục tone
          if [ -d "tone" ]; then
            cd tone
            # Lấy danh sách file .txt (bỏ qua index.json), xuất ra dạng JSON array chuẩn
            ls -1 *.txt 2>/dev/null | jq -R . | jq -s . > index.json || echo "[]" > index.json
            cd ..
          fi

          # Cập nhật index.json trong thư mục music
          if [ -d "music" ]; then
            cd music
            # Lấy danh sách các file audio (.wav, .mp3, .aac, .mid...)
            ls -1 *.wav *.mp3 *.mid 2>/dev/null | jq -R . | jq -s . > index.json || echo "[]" > index.json
            cd ..
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tone/index.json music/index.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update index.json for tone and music"
          git push
